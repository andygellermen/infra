services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sprachalyzer
      POSTGRES_USER: sprachalyzer
      POSTGRES_PASSWORD: ${SAL_POSTGRES_PASSWORD:-local-development-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sprachalyzer -d sprachalyzer"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - sprachalyzer-postgres:/var/lib/postgresql/data

  migrate:
    build: .
    command: ["sprach-a-lyzer-migrate"]
    environment:
      SAL_DATABASE_URL: postgres://sprachalyzer:${SAL_POSTGRES_PASSWORD:-local-development-only}@postgres:5432/sprachalyzer?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    build: .
    command: ["sprach-a-lyzer-seed"]
    environment:
      SAL_DATABASE_URL: postgres://sprachalyzer:${SAL_POSTGRES_PASSWORD:-local-development-only}@postgres:5432/sprachalyzer?sslmode=disable
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    build: .
    environment:
      SAL_ENV: development
      SAL_HTTP_ADDR: :8080
      SAL_DATABASE_URL: postgres://sprachalyzer:${SAL_POSTGRES_PASSWORD:-local-development-only}@postgres:5432/sprachalyzer?sslmode=disable
    depends_on:
      seed:
        condition: service_completed_successfully
    ports:
      - "8080:8080"

volumes:
  sprachalyzer-postgres:
